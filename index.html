<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAF7" />

    <!-- Primary -->
    <title>Ben Lease — Verified long-term homes in Lagos, Abuja & Ibadan</title>
    <meta
      name="description"
      content="Ben Lease is a Nigerian rental platform for 6 and 12-month homes. Every apartment, duplex and self-con is physically verified, with rent paid directly to the landlord and the lease drafted by lawyers."
    />
    <meta name="author" content="Ben Lease" />
    <meta
      name="keywords"
      content="Nigerian rentals, Lagos apartments, Abuja apartments, Ibadan apartments, long-term rentals, verified homes, direct landlord, Lekki rent, Maitama rent, Bodija rent, lease in Nigeria"
    />
    <link rel="canonical" href="https://benlease.ng/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#2d6a4f" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ben Lease" />
    <meta property="og:title" content="Ben Lease — Homes you can settle into" />
    <meta
      property="og:description"
      content="Verified long-term homes across Lagos, Abuja and Ibadan. Rent paid direct to the landlord. Lease drafted by lawyers. No agent runaround."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://benlease.ng/" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ben Lease — Homes you can settle into" />
    <meta
      name="twitter:description"
      content="Verified long-term homes across Lagos, Abuja and Ibadan. Rent paid direct to the landlord."
    />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "RealEstateAgent",
        "name": "Ben Lease",
        "url": "https://benlease.ng",
        "logo": "https://benlease.ng/apple-touch-icon.svg",
        "image": "https://benlease.ng/og-image.svg",
        "description": "Verified long-term residential rentals across Lagos, Abuja and Ibadan.",
        "areaServed": [
          { "@type": "City", "name": "Lagos" },
          { "@type": "City", "name": "Abuja" },
          { "@type": "City", "name": "Ibadan" }
        ],
        "knowsLanguage": "en",
        "slogan": "Homes you can settle into."
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
